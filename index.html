<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinyl Display</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: monospace;
    color: #fff;
  }
  .wrap {
    position: relative;
    width: min(80vmin, 500px);
    height: min(80vmin, 500px);
  }
  #vinyl {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  position: relative;
  animation: spin 8s linear infinite;
  animation-play-state: paused;
}
#vinyl.playing { animation-play-state: running; }
#album {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.5s;
}

#album.loaded { opacity: 1; }
  #status {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    z-index: 2;
  }
  #status button {
    padding: 10px 20px;
    background: #1db954;
    color: #000;
    border: 0;
    border-radius: 20px;
    font: inherit;
    cursor: pointer;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div id="vinyl"><img id="album" alt=""></div>
    <div id="status"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
